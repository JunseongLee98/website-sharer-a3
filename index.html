<html>

<head>
  <title>Website Sharer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script src="javascripts/api_version.js"></script>
  <script src="javascripts/index.js"></script>
</head>

<body>
  <div class="container mt-4">
    <h1 class="text-center mb-4">Website Sharer</h1>
    
    <!-- URL Input Section -->
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Share a Website</h5>
            <div class="mb-3">
              <label for="urlInput" class="form-label">Website URL</label>
              <input type="text" class="form-control" id="urlInput" placeholder="https://example.com">
            </div>
            <div class="mb-3">
              <label for="descriptionInput" class="form-label">Description</label>
              <textarea class="form-control" id="descriptionInput" rows="3" placeholder="Describe what this website is about..."></textarea>
            </div>
            <div class="mb-3">
              <label for="usernameInput" class="form-label">Username</label>
              <input type="text" class="form-control" id="usernameInput" placeholder="Your username">
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" onclick="previewUrl()">Preview URL</button>
              <button class="btn btn-success" onclick="postUrl()">Post URL</button>
            </div>
            <div id="statusMessage" class="mt-2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Preview Section -->
    <div class="row justify-content-center mt-4">
      <div class="col-md-8">
        <div id="url_previews"></div>
      </div>
    </div>

    <!-- Posts Section -->
    <div class="row justify-content-center mt-4">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Shared Posts</h5>
            <button class="btn btn-outline-primary mb-3" onclick="loadPosts()">Refresh Posts</button>
            <div id="posts"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
